name: tests

# CI minimale du dépôt OpenQuest JDR (phase 6.1 du plan de refactorisation).
#
# Deux jobs indépendants :
#  - server : typecheck + build + tests du serveur Node (pooling uniquement) ;
#  - godot  : porte de compilation du client (tous scripts + scènes) puis socle
#             rapide de tests headless (tools/refactor/fast-tests.txt).
#
# Les tests de capture (*_shot_test) ne sont PAS lancés ici : ils exigent un GPU
# réel et une fenêtre (README de scripts/run_tests.ps1). Les tests rouges connus
# sont listés dans scripts/known_broken_tests.txt et exclus par le runner.

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Serveur (Node/TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Installation
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Tests (lobby + signalisation)
        run: npm test

  godot:
    name: Client Godot (compilation + socle rapide)
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: '4.7.2'
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger Godot headless
        run: |
          set -euo pipefail
          curl -fsSLo godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT_BIN=$PWD/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Importer le projet
        run: "$GODOT_BIN --headless --path game --import"
      - name: Porte de vérification (compilation + scènes + socle rapide)
        run: pwsh -NoLogo -File ./tools/refactor/verify.ps1 -Scenes -SkipServer

  data:
    name: Contrat data/schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Auto-test + schémas conformes (gate)
        run: python tools/refactor/validate_data.py --only bot,ruleset
      - name: Dérive complète (informatif, cf. RAPPORT_SCHEMAS.md)
        continue-on-error: true
        run: python tools/refactor/validate_data.py
